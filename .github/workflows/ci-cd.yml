name: ci-cd

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            syedshah3994/capstone-client:${{ github.sha }}
            syedshah3994/capstone-client:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, client-vm]
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        run: |
          sed -i "s|image: syedshah3994/capstone-client:.*|image: syedshah3994/capstone-client:${{ github.sha }}|" docker-compose.yml
      - name: Write env
        env:
          SERVER_PRIVATE_IP: ${{ secrets.SERVER_PRIVATE_IP }}
        run: |
          echo "SERVER_HOST=${SERVER_PRIVATE_IP}" > .env
      - name: Pull image
        run: docker compose pull
      - name: Deploy
        run: docker compose up --exit-code-from client
      - name: Show result
        if: always()
        run: |
          docker ps -a
          grep image: docker-compose.yml
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -s -X POST -H 'Content-type: application/json' --data "{\"text\":\"capstone-client deploy ${JOB_STATUS} for commit ${GITHUB_SHA}\"}" "$SLACK_WEBHOOK_URL"
